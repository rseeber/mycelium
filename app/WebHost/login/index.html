<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <link rel="apple-touch-icon" sizes="180x180" href="/src/assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/src/assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/src/assets/favicon/favicon-16x16.png">
    <link rel="manifest" href="/src/assets/favicon/site.webmanifest">


    <link rel="stylesheet" href="/src/style.css">
    <link rel="stylesheet" href="login.css">

    <script type="module" src="/src/login.jsx"></script> 
    <title>Login</title>
</head>
<body>
	<h1>Log In</h1>
	<form id="login-form" onSubmit="return doLogin()">
		<div class="container">
			<label for="uname"><b>Username</b></label>
			<input type="text" placeholder="Enter Username" name="uname" required/><br/>

			<label for="psw"><b>Password</b></label>
			<input type="password" placeholder="Enter Password" name="psw" required/><br/>
			
			<button type="button" onClick="return doLogin()">Login</button>
		</div>
	</form>
	<h1>Sign Up</h1>
	<form id="signup-form" onSubmit="return doSignup()">
		<div class="container">
			<label for="uname"><b>Username</b></label>
			<input type="text" placeholder="Enter Username" name="uname" required/><br/>

			<label for="uname"><b>Email</b></label>
			<input type="text" placeholder="Enter Username" name="uname" required/><br/>

			<label for="psw"><b>Password</b></label>
			<input type="password" placeholder="Enter Password" name="psw" required/><br/>
			
			<button type="button" onClick="return doSignup()">Login</button>
		</div>
	</form>
	<div id="signup-success-message" style="display: none;"><p>Account created successfully! Please <a href="/login/">click here</a> to now login.</p></div>
</body>
</html>
